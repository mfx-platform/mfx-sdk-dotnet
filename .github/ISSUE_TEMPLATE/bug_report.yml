name: Bug report
description: The SDK did something it should not, or did not do something it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Leave out API keys, private keys, broker logins, passwords and anything else that
        identifies an account. A security problem goes to the Security tab, not here.
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      description: "`MfxClient.UserAgent`, or the MfxHub.Sdk version in your project file"
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: dotnet-version
    attributes:
      label: .NET version and operating system
      description: "`dotnet --version`"
      placeholder: .NET 10.0.100 on Windows 11
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: The smallest code that shows it
      render: csharp
  - type: textarea
    id: output
    attributes:
      label: Output or exception
      description: The SDK masks secrets in its own output; check anything else you paste.
      render: text
