# Weekly update proposals for the NuGet dependencies (the package references of every project) and
# the pinned actions. This repository is published from the one the SDK is developed in, so a
# proposal here is applied there and arrives with the next release; the pull request is then closed
# with a link to it.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    # Microsoft.Extensions.* follows the .NET line the SDK targets (net10.0): a new major is taken
    # with the target framework, on purpose, not as a routine update.
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    # A new major version of an action changes its inputs or its runtime: taken on purpose, with
    # the workflows checked, not merged as a routine update.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
